<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>5x5 Polyomino Puzzle Prototype</title>
<style>
  :root{
    --cell-size:56px;
    --gap:4px;
    --board-size: calc(var(--cell-size) * 5 + var(--gap) * 4);
  }
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;gap:24px;padding:24px;background:#f6f7fb;color:#111}
  .container{display:flex;flex-direction:column;gap:12px}
  .topbar{display:flex;align-items:center;gap:12px}
  .board{
    width:var(--board-size);height:var(--board-size);
    display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
    gap:var(--gap);background:#e6e9f2;padding:var(--gap);border-radius:10px;box-shadow:0 6px 18px rgba(20,30,60,0.08)
  }
  .cell{
    width:var(--cell-size);height:var(--cell-size);background:#fff;border-radius:6px;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#333;user-select:none;
  }
  .cell.blocked{background:#444;color:#fff}
  .cell.filled{background:transparent}
  .pieces{display:flex;flex-wrap:wrap;gap:10px;max-width:420px}
  .piece{
    position:relative;touch-action:none;cursor:grab;border-radius:6px;
    display:inline-block;padding:6px;background:transparent;
  }
  .piece .tile{width:20px;height:20px;margin:2px;display:inline-block;box-sizing:border-box;border-radius:3px}
  .controls{display:flex;gap:8px}
  button{padding:8px 12px;border-radius:8px;border:0;background:#2b6ef6;color:#fff;cursor:pointer}
  button.secondary{background:#6b7280}
  .ghost{position:absolute;pointer-events:none;opacity:.6;z-index:1000}
  .invalid{outline:3px solid rgba(220,38,38,0.9);border-radius:6px}
  .valid{outline:3px solid rgba(34,197,94,0.9);border-radius:6px}
  .hud{display:flex;gap:12px;align-items:center}
  .small{font-size:13px;color:#555}
  .message{color:#0b6; font-weight:600}
  @media (max-width:720px){:root{--cell-size:44px}}
</style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="hud">
        <div class="small">Daily Puzzle Prototype</div>
        <div class="small">|</div>
        <div class="small">Grid 5×5</div>
      </div>
      <div style="flex:1"></div>
      <div class="controls">
        <button id="newBtn">New Game</button>
        <button id="undoBtn" class="secondary">Undo</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>

    <div style="display:flex;gap:20px;align-items:flex-start">
      <div>
        <div id="board" class="board" aria-label="Puzzle board"></div>
        <div style="margin-top:8px" class="small">Blocked cells are dark grey. Drag pieces onto the grid and rotate by clicking a piece.</div>
      </div>

      <div style="width:420px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="small">Pieces</div>
          <div id="status" class="small"></div>
        </div>
        <div id="pieces" class="pieces" aria-label="Available pieces"></div>
        <div style="margin-top:12px" class="small">Tip: Pieces snap to grid. Invalid drops are rejected.</div>
      </div>
    </div>
    <div id="log" class="small"></div>
  </div>

<script>
/* ====== Piece definitions ======
 Each piece: id, name, color, cells offsets (x,y)
 Offsets are canonical; rotations computed at startup.
*/
const PIECES = [
  {id:1,name:'I',color:'#06b6d4',cells:[[0,0],[1,0],[2,0],[3,0]]}, // length 4
  {id:2,name:'O',color:'#facc15',cells:[[0,0],[1,0],[0,1],[1,1]]}, // 2x2
  {id:3,name:'T',color:'#7c3aed',cells:[[0,0],[1,0],[2,0],[1,1]]},
  {id:4,name:'L',color:'#fb923c',cells:[[0,0],[0,1],[0,2],[1,2]]},
  {id:5,name:'J',color:'#3b82f6',cells:[[1,0],[1,1],[1,2],[0,2]]},
  {id:6,name:'S',color:'#10b981',cells:[[1,0],[2,0],[0,1],[1,1]]},
  {id:7,name:'Z',color:'#ef4444',cells:[[0,0],[1,0],[1,1],[2,1]]},
  {id:8,name:'U',color:'#06b6d4',cells:[[0,0],[2,0],[0,1],[1,1],[2,1]]}, // 5
  {id:9,name:'P',color:'#ec4899',cells:[[0,0],[1,0],[0,1],[1,1],[0,2]]}, // 5
  {id:10,name:'N',color:'#8b5e3c',cells:[[0,0],[0,1],[1,1],[1,2]]}
];

const GRID_SIZE = 5;
let blocked = []; // boolean grid
let placedGrid = []; // id or 0
let availablePieces = []; // instances with rotations
let pieceElements = new Map();
let undoStack = [];

/* Utility functions */
function cloneGrid(g){ return g.map(row=>row.slice()); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

/* Precompute rotations for each piece */
function rotateOffsets(offsets){
  // rotate 90deg clockwise: (x,y) -> (y, -x)
  return offsets.map(([x,y])=>[y, -x]);
}
function normalize(offsets){
  let xs = offsets.map(o=>o[0]), ys = offsets.map(o=>o[1]);
  let minx = Math.min(...xs), miny = Math.min(...ys);
  return offsets.map(([x,y])=>[x-minx,y-miny]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}
function uniqueOrientations(cells, allowFlip=false){
  let set = new Map();
  let cur = cells.map(c=>c.slice());
  for(let r=0;r<4;r++){
    cur = normalize(cur);
    set.set(JSON.stringify(cur), cur.map(a=>a.slice()));
    cur = rotateOffsets(cur);
  }
  if(allowFlip){
    // flip horizontally and repeat
    let flipped = cells.map(([x,y])=>[-x,y]);
    cur = flipped;
    for(let r=0;r<4;r++){
      cur = normalize(cur);
      set.set(JSON.stringify(cur), cur.map(a=>a.slice()));
      cur = rotateOffsets(cur);
    }
  }
  return Array.from(set.values());
}

/* Build piece instances with rotations */
const PIECE_LIBRARY = PIECES.map(p=>{
  return {
    id:p.id, name:p.name, color:p.color, area:p.cells.length,
    rotations: uniqueOrientations(p.cells, false)
  };
});

/* ====== Board rendering ====== */
const boardEl = document.getElementById('board');
const piecesEl = document.getElementById('pieces');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

function renderBoard(){
  boardEl.innerHTML = '';
  for(let y=0;y<GRID_SIZE;y++){
    for(let x=0;x<GRID_SIZE;x++){
      const cell = document.createElement('div');
      cell.className = 'cell' + (blocked[y][x] ? ' blocked' : '');
      cell.dataset.x = x; cell.dataset.y = y;
      boardEl.appendChild(cell);
    }
  }
}

/* ====== Generator and solver ====== */
/* Backtracking solver that tries to place all pieces on the grid.
   pieces param: array of piece objects {id, rotations}
   blocked: boolean grid
   returns true if solvable (and optionally a placement)
*/
function solveTiling(pieces, blockedGrid){
  // grid of 0/1 for filled
  let filled = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(0));
  for(let y=0;y<GRID_SIZE;y++) for(let x=0;x<GRID_SIZE;x++) if(blockedGrid[y][x]) filled[y][x]=1;
  // sort pieces descending by area (heuristic)
  let order = pieces.slice().sort((a,b)=>b.area - a.area);

  function canPlaceAt(rot, ox, oy){
    for(const [dx,dy] of rot){
      const x = ox + dx, y = oy + dy;
      if(x<0||x>=GRID_SIZE||y<0||y>=GRID_SIZE) return false;
      if(filled[y][x]) return false;
    }
    return true;
  }
  function place(rot, ox, oy, val){
    for(const [dx,dy] of rot){
      filled[oy+dy][ox+dx] = val;
    }
  }

  function backtrack(idx){
    if(idx === order.length) return true;
    const piece = order[idx];
    for(const rot of piece.rotations){
      for(let y=0;y<GRID_SIZE;y++){
        for(let x=0;x<GRID_SIZE;x++){
          if(canPlaceAt(rot,x,y)){
            place(rot,x,y,1);
            if(backtrack(idx+1)) return true;
            place(rot,x,y,0);
          }
        }
      }
    }
    return false;
  }
  return backtrack(0);
}

/* Generate a puzzle:
   - choose B blocked cells (between minB and maxB)
   - choose random pieces whose total area = 25 - B
   - verify solvability with solver; retry until solvable or attempts exhausted
*/
function generatePuzzle({minB=2,maxB=5,maxAttempts=200} = {}){
  for(let attempt=0; attempt<maxAttempts; attempt++){
    // choose B
    const B = randInt(minB,maxB);
    // pick B distinct blocked cells
    let cells = Array.from({length:GRID_SIZE*GRID_SIZE},(_,i)=>i);
    // shuffle
    for(let i=cells.length-1;i>0;i--){ const j=randInt(0,i); [cells[i],cells[j]]=[cells[j],cells[i]]; }
    const blockedIdx = new Set(cells.slice(0,B));
    // build blocked grid
    let candidateBlocked = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(false));
    for(const idx of blockedIdx){ candidateBlocked[Math.floor(idx/GRID_SIZE)][idx%GRID_SIZE]=true; }

    // choose pieces randomly until area matches target
    const target = GRID_SIZE*GRID_SIZE - B;
    // We'll pick random pieces (allow repeats) until sum==target or fail
    // To keep variety, pick from library without repeats first, then allow repeats if needed
    let pool = PIECE_LIBRARY.slice();
    // shuffle pool
    for(let i=pool.length-1;i>0;i--){ const j=randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    let chosen = [];
    let sum = 0;
    // greedy pick largest-first from shuffled pool
    for(const p of pool){
      if(sum + p.area <= target){
        chosen.push(p);
        sum += p.area;
      }
      if(sum === target) break;
    }
    // if not matched, try adding smaller pieces (allow repeats)
    if(sum !== target){
      // try random combinations with limited attempts
      let tries = 0, success=false;
      while(tries < 200 && !success){
        tries++;
        let cand = [];
        let s = 0;
        // pick random pieces (with repeats) until s >= target
        while(s < target && cand.length < 10){
          const p = PIECE_LIBRARY[randInt(0,PIECE_LIBRARY.length-1)];
          if(s + p.area <= target){ cand.push(p); s += p.area; } else break;
        }
        if(s === target){ chosen = cand; success=true; break; }
      }
      if(!chosen.length) continue; // try new blocked pattern
    }

    // verify solvability
    if(solveTiling(chosen, candidateBlocked)){
      // success: set global state
      blocked = candidateBlocked;
      availablePieces = chosen.map((p,idx)=>({
        instanceId: idx+1,
        id: p.id,
        name: p.name,
        color: p.color,
        area: p.area,
        rotations: p.rotations
      }));
      placedGrid = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(0));
      undoStack = [];
      return {blocked, pieces:availablePieces};
    }
    // else retry
  }
  throw new Error('Failed to generate solvable puzzle after many attempts');
}

/* ====== UI and drag-drop logic ====== */
function createPieceElement(piece){
  const el = document.createElement('div');
  el.className = 'piece';
  el.draggable = false;
  el.style.touchAction = 'none';
  el.dataset.instanceId = piece.instanceId;
  el.dataset.rotIndex = 0;
  el.style.userSelect = 'none';
  // render a small preview grid for the piece
  const maxDim = 5;
  const preview = document.createElement('div');
  preview.style.display='inline-grid';
  preview.style.gridTemplateColumns = `repeat(${maxDim},18px)`;
  preview.style.gridAutoRows = '18px';
  preview.style.gap = '2px';
  preview.style.background = 'transparent';
  preview.style.padding = '4px';
  preview.style.borderRadius = '8px';
  preview.style.border = '1px solid rgba(0,0,0,0.06)';
  preview.style.minWidth = '80px';
  // compute bounding box for first rotation
  const rot = piece.rotations[0];
  let maxX = Math.max(...rot.map(r=>r[0])), maxY = Math.max(...rot.map(r=>r[1]));
  const w = maxX+1, h = maxY+1;
  preview.style.gridTemplateColumns = `repeat(${w},18px)`;
  preview.style.gridAutoRows = `18px`;
  // fill preview cells
  for(let i=0;i<w*h;i++){
    const tile = document.createElement('div');
    tile.style.width='18px'; tile.style.height='18px'; tile.style.boxSizing='border-box';
    tile.style.borderRadius='3px';
    tile.style.background='transparent';
    preview.appendChild(tile);
  }
  for(const [x,y] of rot){
    const idx = y*w + x;
    const tile = preview.children[idx];
    tile.style.background = piece.color;
  }
  el.appendChild(preview);

  // interactions: rotate on click/tap
  el.addEventListener('click', (e)=>{
    // rotate 90deg clockwise
    const cur = parseInt(el.dataset.rotIndex||0,10);
    const next = (cur+1) % piece.rotations.length;
    el.dataset.rotIndex = next;
    // update preview
    const rot = piece.rotations[next];
    // recompute bounding box
    let maxX = Math.max(...rot.map(r=>r[0])), maxY = Math.max(...rot.map(r=>r[1]));
    const w = maxX+1, h = maxY+1;
    const preview = el.querySelector('div');
    preview.style.gridTemplateColumns = `repeat(${w},18px)`;
    preview.innerHTML = '';
    for(let i=0;i<w*h;i++){
      const tile = document.createElement('div');
      tile.style.width='18px'; tile.style.height='18px'; tile.style.boxSizing='border-box';
      tile.style.borderRadius='3px';
      tile.style.background='transparent';
      preview.appendChild(tile);
    }
    for(const [x,y] of rot){
      const idx = y*w + x;
      const tile = preview.children[idx];
      tile.style.background = piece.color;
    }
  });

  // drag logic using pointer events
  let dragging = false;
  let ghost = null;
  let startX=0,startY=0,offsetX=0,offsetY=0;
  el.addEventListener('pointerdown', (ev)=>{
    ev.preventDefault();
    el.setPointerCapture(ev.pointerId);
    dragging = true;
    startX = ev.clientX; startY = ev.clientY;
    el.style.cursor = 'grabbing';
    // create ghost
    ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.style.left = ev.pageX
